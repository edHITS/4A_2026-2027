<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Szczegóły: {{ produkt.nazwa }}</title>
</head>
<body>
    <h1>Szczegóły elementu: {{ produkt.nazwa }}</h1>
    <ul>
        <li><strong>ID:</strong> {{ produkt.id }}</li>
        <li><strong>Nazwa:</strong> {{ produkt.nazwa }}</li>
        <li><strong>Kategoria:</strong> {{ produkt.kategoria }}</li>
        <li><strong>Cena:</strong> {{ produkt.cena }} zł</li>
        <li><strong>Status:</strong> {% if produkt.dostepny %}Dostępny{% else %}Brak{% endif %}</li>
    </ul>

    <p><a href="{{ url_for('lista') }}">← Powrót do listy</a></p>
</body>
</html>
